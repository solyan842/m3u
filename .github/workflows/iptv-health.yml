name: IPTV health check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "iptv.m3u"
      - "tools/check_playlist.py"
      - ".github/workflows/iptv-health.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check playlist streams
        run: python3 tools/check_playlist.py

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: iptv-health-report
          path: |
            health.json
            health-report.md
          retention-days: 7
