name: Probe VTV8 candidates

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/probe-vtv8-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from urllib.parse import urljoin

          candidates = [
            ("FPT53 epzhd1 5M","https://live.fptplay53.net/epzhd1/vtv8hd_vhls.smil/chunklist_b5000000.m3u8","Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"),
            ("FPT53 epzhd1 auto","https://live.fptplay53.net/epzhd1/vtv8hd_vhls.smil/chunklist.m3u8","Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"),
            ("FPT53 fnxhd1 5M","https://live.fptplay53.net/fnxhd1/vtv8hd_vhls.smil/chunklist_b5000000.m3u8","Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"),
            ("VCDN 1080p","http://drfamaga5qliv.vcdn.cloud/vtv08/vtv08@1080p.m3u8","CoocaaTV"),
          ]

          for name,url,ua in candidates:
            print("\n==",name,"==")
            h={"User-Agent":ua}
            try:
              r=requests.get(url,headers=h,timeout=12,allow_redirects=True)
              print("manifest",r.status_code,r.url,r.headers.get("content-type"),"bytes",len(r.content))
              txt=r.text if r.status_code==200 else ""
              print("m3u8", "#EXTM3U" in txt)
              if "#EXTM3U" not in txt:
                continue
              lines=[x.strip() for x in txt.splitlines() if x.strip()]
              seg=None
              for x in lines:
                if not x.startswith("#"):
                  seg=urljoin(r.url,x); break
              if seg:
                rr=requests.get(seg,headers={**h,"Range":"bytes=0-4095"},timeout=12,allow_redirects=True)
                print("segment",rr.status_code,rr.url,rr.headers.get("content-type"),"bytes",len(rr.content))
            except Exception as e:
              print("ERROR",type(e).__name__,str(e))
          PY
