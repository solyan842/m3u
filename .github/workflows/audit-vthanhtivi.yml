name: Audit VThanhTivi mirror

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/audit-vthanhtivi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch VThanhTivi mirror
        run: |
          curl -fL --retry 2             https://raw.githubusercontent.com/pnduyy/iptv/main/tivi             -o iptv.m3u
          echo "channels=$(grep -c '^#EXTINF' iptv.m3u)"

      - name: Deep-check all streams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tools/check_playlist.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace('if ch["group"] in ("HTV", "SCTV", "VTVcab", "Box"):', 'if True:')
          p.write_text(s, encoding="utf-8")
          PY
          python3 tools/check_playlist.py

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: vthanhtivi-audit
          path: |
            iptv.m3u
            health.json
            health-report.md
          retention-days: 2
