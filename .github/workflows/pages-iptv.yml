name: Publish short IPTV URL

on:
  push:
    branches: [ main ]
    paths:
      - "iptv.m3u"
      - ".github/workflows/pages-iptv.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tiny IPTV site
        run: |
          mkdir -p _site
          cp iptv.m3u _site/tv
          cp iptv.m3u _site/iptv.m3u
          printf '<!doctype html><meta charset="utf-8"><title>SolYan IPTV</title><p>SolYan IPTV playlist</p>' > _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
